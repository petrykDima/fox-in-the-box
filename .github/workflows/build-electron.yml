# .github/workflows/build-electron.yml
name: Build Electron

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: Build Electron — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: fox-windows
            artifact-path: packages/electron/dist/*.exe
          - os: macos-latest
            artifact-name: fox-macos
            artifact-path: packages/electron/dist/*.dmg

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Windows: enable long paths in git and OS (pnpm hashed store paths exceed MAX_PATH)
      - name: Enable long paths (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          Write-Host "Long paths enabled"

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Windows: use npm install (flat node_modules) to avoid pnpm's deeply-hashed
      # store paths that exceed Windows MAX_PATH — makensis.exe can't open NSIS includes
      # from paths like node_modules/.pnpm/app-builder-lib@24.13.3_<longhash>/...
      - name: Install dependencies
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cd packages/electron
            npm install
          else
            pnpm install --frozen-lockfile
          fi

      # macOS: GitHub Secrets cannot safely hold raw binary .p12 — store base64 of the file
      # (same bytes as exporting "Developer ID Application" cert to .p12 from Keychain Access).
      # Optional: if the secret exceeds GitHub's ~48KB limit, host the .p12 privately and set
      # MACOS_CSC_P12_BASE64 to empty; instead set CSC_LINK to an https:// URL (see electron-builder docs).
      - name: Build Electron app
        working-directory: packages/electron
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_CSC_P12_BASE64: ${{ secrets.MACOS_CSC_P12_BASE64 }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          MACOS_CSC_LINK_URL: ${{ secrets.MACOS_CSC_LINK_URL }}
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ -n "${MACOS_CSC_LINK_URL:-}" ]]; then
              export CSC_LINK="${MACOS_CSC_LINK_URL}"
              export CSC_KEY_PASSWORD="${MACOS_CSC_KEY_PASSWORD}"
            elif [[ -n "${MACOS_CSC_P12_BASE64:-}" ]]; then
              b64="${MACOS_CSC_P12_BASE64}"
              if [[ "$b64" == data:* ]]; then
                b64="${b64#*,}"
              fi
              printf '%s' "$b64" | base64 -d > "${RUNNER_TEMP}/certificate.p12"
              chmod 600 "${RUNNER_TEMP}/certificate.p12"
              export CSC_LINK="file://${RUNNER_TEMP}/certificate.p12"
              export CSC_KEY_PASSWORD="${MACOS_CSC_KEY_PASSWORD}"
            else
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          fi
          pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 30

      - name: Rename artifact to stable filename
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: packages/electron/dist
        run: |
          # Rename to fixed filenames so website can link to /releases/latest/download/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv *.exe fox-in-the-box-setup.exe
          else
            mv *.dmg fox-in-the-box.dmg
          fi

      - name: Upload to GitHub Release (tagged releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-path }}
          generate_release_notes: false   # release.yml owns release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
